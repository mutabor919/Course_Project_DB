<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Система ИБ{% endblock %}</title>
    <!-- Подключаем Bootstrap 5 (Стили) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<!-- Навигационная панель (Меню) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">🛡️ Incidents.IB</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/">Главная</a>
        </li>
      </ul>

      <!-- Вот здесь мы оставили ТОЛЬКО правильный блок -->
      <span class="navbar-text">
        {% if user.is_authenticated %}
            <!-- Если вошел: Показываем имя, роль и кнопку Выход -->
            <span class="text-light me-3">
                👤 {{ user.fio|default:user.username }}
                <span class="badge bg-secondary">{{ user.role.name|default:"Роль не назначена" }}</span>
            </span>

            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
            </form>
        {% else %}
            <!-- Если гость: Кнопка Войти -->
            <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Войти</a>
        {% endif %}
      </span>

    </div>
  </div>
</nav>

<!-- Основной контент страницы -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- Подключаем Bootstrap JS (для работы кнопок и меню) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
